name: lingo
description: "LINGO - Interactive ASL learning and communication app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local storage
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Authentication and cloud profile storage
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.11

  # Camera & ML
  camera: ^0.11.4
  hand_detection: ^4.1.0
  flutter_litert: ^3.8.0
  permission_handler: ^11.4.0

  # UI / Animation
  lottie: ^3.5.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/references/symbols/
    - assets/references/words/
