name: lingo
description: "LINGO - Interactive ASL learning and communication app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local storage
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Camera & ML
  camera: ^0.11.1
  permission_handler: ^11.4.0

  # UI / Animation
  lottie: ^3.1.3
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
